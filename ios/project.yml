name: TapTrace
options:
  bundleIdPrefix: com.taptrace
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  TapTrace:
    type: application
    platform: iOS
    sources:
      - path: TapTrace
    resources:
      - path: TapTrace/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taptrace.app
        DEVELOPMENT_TEAM: GFC3N73392
        INFOPLIST_FILE: TapTrace/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
